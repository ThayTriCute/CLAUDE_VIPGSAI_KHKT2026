# Production uses process restarts for releases. Do not unload Python modules
# while other student sessions may still be importing or using them.
# Local development can explicitly override this with --server.fileWatcherType=auto.
[server]
fileWatcherType = "none"
runOnSave = false

# app.py renders explicitly through st.* and component calls. Avoid the extra
# AST traversal for notebook-style implicit rendering on this large script.
[runner]
magicEnabled = false
