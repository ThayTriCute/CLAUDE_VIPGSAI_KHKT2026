# VIP 74.1 CI/CD Configuration - HỆ THỐNG GIA SƯ AI THPT 2026
name: GSAI THPT 2026 - Automated CI/CD Quality Assurance

on:
  workflow_dispatch:
  push:
    branches: [ main, 'integration/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install optional voice test dependencies
      run: python -m pip install -r requirements-test.txt

    - name: Require all voice worker contract tests
      run: |
        python -c "from tests.test_local_voice_server import TestClient; assert TestClient is not None, 'Voice test dependencies unavailable'"
        python -m unittest tests.test_local_voice_server -v

    - name: Step 0 - Static gate (undefined names, syntax)
      run: |
        python -m pip install "ruff>=0.9,<1"
        ruff check --isolated --select E9,F63,F7,F82 app.py precision_visual_engine.py real_exam_engine.py database.py lesson_infographic_engine.py services models

    - name: Step 1 - Syntax & Compilation Integrity Check
      run: |
        python -m py_compile app.py precision_visual_engine.py real_exam_engine.py database.py lesson_infographic_engine.py

    - name: Step 2 - Run Automated System Integrity Tests
      run: |
        python -m unittest discover -s tests -p "test_*.py"

    - name: Step 3 - Station smoke (AppTest Trạm 1–5 + Trạm 5 data UI)
      run: |
        python -m unittest tests.test_station_ui tests.test_admin_guard tests.test_station_auth -q
        python scripts/smoke_tram5_data_ui.py
      env:
        STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
