name: Official legal source watch
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-legal-source-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - uses: actions/cache/restore@v4
        with:
          path: legal-watch-report/latest.json
          key: legal-watch-${{ github.run_id }}
          restore-keys: legal-watch-
      - name: Scan official references and discovery listing
        id: scan
        continue-on-error: true
        run: python scripts/check_legal_sources.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: legal-watch-report/latest.json
          key: legal-watch-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legal-source-watch-${{ github.run_id }}
          path: legal-watch-report/
          retention-days: 30
      - name: Require review when sources changed or could not be checked
        if: steps.scan.outcome != 'success'
        run: exit 1
